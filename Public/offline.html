<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – Metallbau</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 50%, #0c0a09 100%);
      color: #e2e8f0; padding: 1.5rem;
    }
    .card {
      width: min(420px, 100%);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      padding: 2rem 1.75rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.4);
      animation: in .35s cubic-bezier(.34,1.2,.64,1) both;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(12px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .icon {
      width: 4rem; height: 4rem; margin: 0 auto 1.25rem;
      border-radius: 1rem; display: flex; align-items: center; justify-content: center;
      background: rgba(234,88,12,.15); color: #fb923c;
    }
    h1 { margin: 0 0 .5rem; font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
    p { margin: 0 0 1.5rem; font-size: .9rem; color: #94a3b8; line-height: 1.5; }
    .actions { display: flex; flex-direction: column; gap: .65rem; }
    button, a.btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      border: none; border-radius: .75rem; padding: .8rem 1rem;
      font-weight: 600; font-size: .875rem; cursor: pointer; text-decoration: none;
      transition: filter .15s, transform .1s;
    }
    button:active, a.btn:active { transform: scale(.98); }
    .primary { background: #ea580c; color: #fff; box-shadow: 0 4px 14px rgba(234,88,12,.35); }
    .ghost { background: rgba(255,255,255,.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,.12); }
    .hint { margin-top: 1.25rem; font-size: .7rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18"/>
      </svg>
    </div>
    <h1>Du bist offline</h1>
    <p>Keine Internetverbindung. Gespeicherte Daten bleiben verfügbar – Stempelzeiten werden automatisch synchronisiert, sobald wieder Netz da ist.</p>
    <div class="actions">
      <button class="primary" onclick="location.reload()">Erneut verbinden</button>
      <a class="btn ghost" href="/">Zur Startseite</a>
      <a class="btn ghost" href="/timetracking">Zur Stempeluhr</a>
    </div>
    <p class="hint">Metallbau Management · Offline-Modus</p>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
