<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kein Internet – Metallbau App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 3.5rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: .6rem; }
    p { font-size: .9rem; color: #94a3b8; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 1.75rem;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: .85rem;
      padding: .65rem 1.5rem;
      border-radius: .65rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.15); }
    .hint {
      margin-top: 1.25rem;
      font-size: .75rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Keine Internetverbindung</h1>
    <p>Die App kann im Moment nicht erreicht werden.<br>Bitte überprüfe deine Verbindung und versuche es erneut.</p>
    <button class="btn" onclick="window.location.reload()">🔄 Erneut versuchen</button>
    <p class="hint">Die Stempeluhr funktioniert auch offline – Einträge werden synchronisiert sobald du wieder online bist.</p>
  </div>
</body>
</html>
